[tool.poetry]
name = "oldap-tools"
version = "1.0.0rc1"
description = "CLI tools for OLDAP"
authors = ["Lukas Rosenthaler <lukas.rosenthaler@unibas.ch>"]
readme = "README.md"
license = "GPL-3.0-only"
packages = [{ include = "oldap_tools", from = "src" }]
include = ["src/oldap_tools/schemas/*.yaml"]


[tool.poetry.dependencies]
python = "^3.12,<4.0"
typer = "^0.20.0"
rdflib = "^7.5.0"
oldaplib = {version = ">=1.0.0rc1,<2.0.0", allow-prereleases = true}
bump-my-version = "^1.2.7"
pyyaml = "^6.0.2"
yamale = "^6.1.0"
requests = "^2.32.5"

[tool.poetry.scripts]
oldap-tools = "oldap_tools.cli:main"

[tool.bumpversion]
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:(?P<release>rc)(?P<num>\d+))?'
serialize = ["{major}.{minor}.{patch}{release}{num}", "{major}.{minor}.{patch}"]
current_version = "1.0.0rc1"
commit = true
tag = true
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/oldap_tools/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bumpversion.parts.release]
optional_value = "final"
values = ["rc", "final"]

[tool.bumpversion.parts.num]
first_value = 1
