          de: Datum, an dem das Archivmedienobjekt erstellt oder digitalisiert wurde.
          fr: Date à laquelle l'objet média d'archive a été créé ou numérisé.
          it: Data in cui l'oggetto multimediale d'archivio è stato creato o digitalizzato.
