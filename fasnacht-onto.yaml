          de: Titel oder vergebener Name einer digitalen Mediendarstellung im Archiv.
          fr: Titre ou nom attribué à une représentation média numérique dans l'archive.
          it: Titolo o nome attribuito a una rappresentazione multimediale digitale nell'archivio.
