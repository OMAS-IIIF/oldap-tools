          en: Person or organisation that created the archive media item.
          de: Person oder Organisation, die das Archivmedienobjekt erstellt hat.
          fr: Personne ou organisation qui a créé l'objet média d'archive.
          it: Persona o organizzazione che ha creato l'oggetto multimediale d'archivio.
