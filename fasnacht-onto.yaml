          it: Descrizione
        description:
          en: Description of the media representation and what it shows about the archival object.
          de: Beschreibung der Mediendarstellung und dessen, was sie am Archivobjekt zeigt.
          fr: Description de la représentation média et de ce qu'elle montre de l'objet d'archive.
          it: Descrizione della rappresentazione multimediale e di ciò che mostra dell'oggetto d'archivio.
