          de: Archivobjekt, das durch dieses Medienobjekt abgebildet, digitalisiert oder anderweitig repräsentiert wird.
          fr: Objet d'archive représenté, numérisé ou autrement documenté par cet objet média.
          it: Oggetto d'archivio raffigurato, digitalizzato o altrimenti rappresentato da questo oggetto multimediale.
