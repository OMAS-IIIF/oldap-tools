ObjectTaxonomy:
  definition:
  - Vocabolario controllato piatto per oggetti d'archivio descritti autonomamente.
    La forma del supporto digitale è classificata separatamente.@it
  - Flat controlled vocabulary for independently described archival objects. The digital
    media form is classified separately.@en
  - Vocabulaire contrôlé plat pour les objets d'archive décrits de manière autonome.
    La forme du média numérique est classée séparément.@fr
  - Flaches kontrolliertes Vokabular für eigenständig beschriebene Archivobjekte.
    Die digitale Medienform wird separat klassifiziert.@de
  label:
  - Tipi di materiali d'archivio@it
  - Archive material types@en
  - Types de documents et objets d'archive@fr
  - Archivgutarten@de
