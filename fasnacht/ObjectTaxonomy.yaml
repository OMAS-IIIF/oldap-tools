    - Flaches kontrolliertes Vokabular für eigenständig beschriebene Archivobjekte. Die digitale Medienform wird separat klassifiziert.@de
    - Vocabulaire contrôlé plat pour les objets d'archive décrits de manière autonome. La forme du média numérique est classée séparément.@fr
    - Vocabolario controllato piatto per oggetti d'archivio descritti autonomamente. La forma del supporto digitale è classificata separatamente.@it
