CarnivalTopicsTaxonomy:
  label:
    - Carnival themes and domains@en
    - Themen und Bereiche der Fasnacht@de
    - Thèmes et domaines du carnaval@fr
    - Temi e ambiti del carnevale@it
  definition:
    - Themes, practices, and cultural expressions used to describe what a carnival object or event is about. Organisation types, object types, event types, and media formats are classified separately.@en
    - Themen, Praktiken und kulturelle Ausdrucksformen, mit denen beschrieben wird, worum es bei einem Fasnachtsobjekt oder -anlass inhaltlich geht. Organisationsarten, Objektarten, Anlasstypen und Medienformate werden separat klassifiziert.@de
    - Thèmes, pratiques et formes d'expression culturelle décrivant le contenu d'un objet ou d'un événement carnavalesque. Les types d'organisations, d'objets, d'événements et de médias sont classés séparément.@fr
    - Temi, pratiche e forme di espressione culturale che descrivono il contenuto di un oggetto o di un evento carnevalesco. I tipi di organizzazioni, oggetti, eventi e media sono classificati separatamente.@it
  nodes:
