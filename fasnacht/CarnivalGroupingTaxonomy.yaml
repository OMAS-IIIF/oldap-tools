CarnivalGroupingTaxonomy:
  definition:
  - Vocabulaire plat et multivalué décrivant le type d'acteur ou de formation carnavalesque
    représenté, audible ou traité dans un média d'archive. Il ne décrit ni la création,
    le dépôt ou la conservation, ni le type d'une organisation nommément identifiée.@fr
  - Flaches, mehrwertiges Vokabular für die Art von Fasnachtsakteur oder Formation,
    die in einem Archivmedium dargestellt, hörbar oder inhaltlich behandelt wird.
    Es beschreibt weder Urheberschaft, Ablieferung oder Verwahrung noch den Typ einer
    namentlich erfassten Organisation.@de
  - Vocabolario piatto e multivalore che descrive il tipo di attore o formazione carnevalesca
    raffigurato, udibile o trattato in un oggetto multimediale d'archivio. Non descrive
    la paternità, il deposito, la custodia o il tipo di un'organizzazione identificata
    per nome.@it
  - Flat, multi-valued vocabulary describing the type of carnival actor or formation
    depicted, heard, or discussed in an archive media item. It does not describe authorship,
    deposit, custody, or the type of a named organisation.@en
