# Snapshot of the production Jena ontology from https://api.oldap.org (2026-11-10).
# Includes managed fulltext fields and local references to the exported taxonomies.
# Refresh/export instructions: ../docs/jena-fulltext.md.
# Preview an import with: ontology load -i fasnacht/fasnacht-onto.yaml --fulltext apply --dry-run
ontology:
  project:
    shortname: fasnacht
    iri: https://fasnacht.digital
    namespace: http://fasnacht.digital/ns/
    start: '2026-02-08'
    label:
      de: Fasnacht
      en: Carnival
      fr: Carnaval
      it: Carnevale
  lists:
    CarnivalEventTaxonomy: ./CarnivalEventTaxonomy.yaml
    CarnivalGroupingTaxonomy: ./CarnivalGroupingTaxonomy.yaml
    CarnivalPracticeTaxonomy: ./CarnivalPracticeTaxonomy.yaml
    CreativeCommons: ./CreativeCommons.yaml
    LocationTaxonomy: ./LocationTaxonomy.yaml
    MediumRepresentationTaxonomy: ./MediumRepresentationTaxonomy.yaml
    ObjectTaxonomy: ./ObjectTaxonomy.yaml
    OrganisationTaxonomy: ./OrganisationTaxonomy.yaml
    PublicationStatus: ./PublicationStatus.yaml
    StoryKeywords: ./StoryKeywords.yaml
  external_ontologies:
    dcterms:
      namespace: http://purl.org/dc/terms/
      label:
        en: Dublin Core
      comment:
        en: Canonical dublin core vocabulary used by OLDAP.
      proposedResourceClass:
      - Agent
      - AgentClass
      - BibliographicResource
      - Frequency
      - Jurisdiction
      - LicenseDocument
      - Location
      - MediaType
      - MethodOfAccrual
      - PeriodOfTime
      - PhysicalMedium
      - PhysicalResource
      - ProvenanceStatement
      - RightsStatement
      - SizeOrDuration
      proposedDatatypePropertyClass:
      - abstract
      - alternative
      - available
      - bibliographicCitation
      - created
      - date
      - dateAccepted
      - dateCopyrighted
      - dateSubmitted
      - description
      - identifier
      - issued
      - modified
      - subject
      - tableOfContents
      - title
      proposedObjectPropertyClass:
      - audience
      - contributor
      - coverage
      - creator
      - extent
      - hasFormat
      - hasPart
      - hasVersion
      - isFormatOf
      - isPartOf
      - isReferencedBy
      - isReplacedBy
      - isRequiredBy
      - isVersionOf
      - publisher
      - references
      - relation
      - replaces
      - requires
      - rightsHolder
      - spatial
      - temporal
    foaf:
      namespace: http://xmlns.com/foaf/0.1/
      label:
        en: Friend of a Friend
      proposedDatatypePropertyClass:
      - familyName
      - givenName
    schema:
      namespace: https://schema.org/
      label:
        en: schema.org
      proposedResourceClass:
      - Action
      - ArchiveComponent
      - Article
      - Book
      - Collection
      - CreateAction
      - CreativeWork
      - Dataset
      - DigitalDocument
      - Drawing
      - Event
      - HowTo
      - Manuscript
      - Map
      - Organization
      - Person
      - Place
      - Thing
      - VisualArtwork
      proposedDatatypePropertyClass:
      - abstract
      - additionalName
      - copyrightNotice
      - creator
      - description
      - email
      - familyName
      - givenName
      - identifier
      - name
      - telephone
      proposedObjectPropertyClass:
      - about
      - address
      - affiliation
      - agent
      - author
      - birthDate
      - birthPlace
      - contentLocation
      - contributor
      - creator
      - dateCreated
      - dateModified
      - datePublished
      - deathDate
      - deathPlace
      - displayLocation
      - editor
      - endDate
      - geo
      - hasOccupation
      - hasPart
      - isPartOf
      - knows
      - license
      - location
      - memberOf
      - owner
      - participant
      - relatedTo
      - startDate
  classes:
    fasnacht:Agent:
      label:
        de: Agent
        en: Agent
        fr: Agent
        it: Agent
      superclass:
      - dcterms:Agent
      - schema:Agent
      properties: []
    fasnacht:ArchiveMediaObject:
      label:
        de: Archivmedienobjekt
        en: Archive media object
        fr: Objet média d'archive
        it: Oggetto media d'archivio
      superclass:
      - shared:MediaObject
      properties:
      - iri: dcterms:creator
        description:
          de: Person oder Organisation, die das Archivmedienobjekt erstellt hat.
          en: Person or organisation that created the archive media item.
          fr: Personne ou organisation qui a créé l'objet média d'archive.
          it: Persona o organizzazione che ha creato l'oggetto multimediale d'archivio.
        name:
          de: Urheber
          en: Creator
          fr: Auteur
          it: Autore
        order: 11.0
        to_class: fasnacht:Agent
      - iri: dcterms:rights
        description:
          de: Rechte oder Lizenz, welche die Nachnutzung des Archivmedienobjekts regeln.
          en: Rights or licence governing reuse of the archive media item.
          fr: Droits ou licence régissant la réutilisation de l'objet média d'archive.
          it: Diritti o licenza che regolano il riuso dell'oggetto multimediale d'archivio.
        max_count: 1
        min_count: 1
        name:
          de: Lizenz
          en: Licence
          fr: Licence
          it: Licenza
        order: 12.0
        to_class: list:CreativeCommons
      - iri: fasnacht:archiveMediaObjectOf
        description:
          de: Optionale Archivobjekte oder Fasnachtsanlässe, die durch dieses Medienobjekt
            abgebildet, digitalisiert oder anderweitig repräsentiert werden.
          en: Optional archive objects or carnival events depicted, digitised, or
            otherwise represented by this media item.
          fr: Objets d'archive ou événements carnavalesques facultatifs représentés,
            numérisés ou autrement documentés par cet objet média.
          it: Oggetti d'archivio o eventi carnevaleschi facoltativi raffigurati, digitalizzati
            o altrimenti rappresentati da questo oggetto multimediale.
        name:
          de: Medium (Bild, Video, Ton etc.), das ein "Fasnachtsding" (Objekt, Anlass)
            darstellt
          en: Represents archive object/event
          fr: Représente l'objet d'archive
          it: Rappresenta oggetto d'archivio
        order: 5.0
        to_class: fasnacht:CarnivalThing
      - iri: fasnacht:associatedOrganisation
        description:
          de: Organisationen oder Institutionen, die im Medium dargestellt werden
            oder für dessen Inhalt unmittelbar relevant sind. Dies ist nicht die Angabe,
            wer die Datei bereitgestellt hat.
          en: Organisations or institutions depicted by the media item or directly
            relevant to its content. This is distinct from the agent that provided
            the file.
          fr: Organisations ou institutions représentées dans le média ou directement
            concernées par son contenu. Cette propriété est distincte de l'agent ayant
            fourni le fichier.
          it: Organizzazioni o istituzioni rappresentate nel media o direttamente
            rilevanti per il suo contenuto. Questa proprietà è distinta dall'agente
            che ha fornito il file.
        name:
          de: Dargestellte oder inhaltlich verbundene Organisation
          en: Depicted or associated organisation
          fr: Organisation représentée ou associée
          it: Organizzazione rappresentata o associata
        order: 7.0
        to_class: fasnacht:Agent
      - iri: fasnacht:carnivalGrouping
        description:
          de: Arten von Fasnachtsakteuren oder Formationen, die in diesem Archivmedium
            dargestellt, hörbar oder inhaltlich behandelt werden. Dies ist von einer
            konkret identifizierten verbundenen Organisation sowie von Urheberschaft,
            Ablieferung und Verwahrung zu unterscheiden.
          en: Types of carnival actors or formations depicted, heard, or discussed
            in this archive media item. This is distinct from a specifically identified
            associated organisation and from authorship, deposit, or custody.
          fr: Types d'acteurs ou de formations carnavalesques représentés, audibles
            ou traités dans ce média d'archive. Cette indication se distingue d'une
            organisation associée précisément identifiée ainsi que de la création,
            du dépôt et de la conservation.
          it: Tipi di attori o formazioni carnevalesche raffigurati, udibili o trattati
            in questo oggetto multimediale d'archivio. Questa indicazione è distinta
            da un'organizzazione associata identificata e dalla paternità, dal deposito
            o dalla custodia.
        name:
          de: Dargestellte oder behandelte Fasnachtsgruppierung
          en: Depicted or discussed carnival grouping
          fr: Groupement carnavalesque représenté ou traité
          it: Gruppo carnevalesco raffigurato o trattato
        order: 7.0
        to_class: list:CarnivalGroupingTaxonomy
      - iri: fasnacht:carnivalPractice
        description:
          de: Kulturelle Praktiken oder Ausdrucksformen, die dieses Archivmedium direkt
            darstellt oder behandelt.
          en: Cultural practices or forms of expression directly depicted or addressed
            by this archive media item.
          fr: Pratiques culturelles ou formes d'expression directement représentées
            ou abordées par cet objet média d'archive.
          it: Pratiche culturali o forme di espressione direttamente rappresentate
            o trattate da questo oggetto multimediale d'archivio.
        name:
          de: Praxis / Handlung
          en: Carnival practice
          fr: Pratique carnavalesque
          it: Pratica carnevalesca
        order: 6.0
        to_class: list:CarnivalPracticeTaxonomy
      - iri: fasnacht:contributingAgent
        description:
          de: Organisation oder Person, die die digitale Ressource dem Projekt zur
            Verfügung gestellt hat. Dies bezeichnet die Herkunft des Digitalisats
            oder der digitalen Datei, nicht notwendigerweise die Urheberschaft oder
            das Eigentum am ursprünglichen Objekt.
          en: Organisation or person that provided the digital resource to the project.
            This refers to the source of the digital item or file and does not necessarily
            indicate authorship or ownership of the original object.
          fr: Organisation ou personne ayant mis la ressource numérique à disposition
            du projet. Cela désigne la provenance du document numérique ou du fichier
            numérique, sans indiquer nécessairement la paternité ou la propriété de
            l’objet original.
          it: Organizzazione o persona che ha messo la risorsa digitale a disposizione
            del progetto. Questo indica la provenienza del documento o file digitale
            e non implica necessariamente la paternità o la proprietà dell’oggetto
            originale.
        max_count: 1
        min_count: 1
        name:
          de: Zur Verfügung gestellt von
          en: Provided by
          fr: Mis à disposition par
          it: Messo a disposizione da
        order: 10.0
        subproperty_of: schema:provider
        to_class: fasnacht:Agent
      - iri: fasnacht:creationDating
        description:
          de: Datum, an dem der ursprüngliche analoge oder digital entstandene Medieninhalt
            geschaffen oder aufgenommen wurde. Ein späteres Digitalisierungsdatum
            wird hier nicht erfasst.
          en: Date on which the original analogue or born-digital media content was
            created or recorded. A later digitisation date is not recorded here.
          fr: Date à laquelle le contenu média analogique original ou né numérique
            a été créé ou enregistré. La date d'une numérisation ultérieure n'est
            pas enregistrée ici.
          it: Data in cui il contenuto multimediale analogico originale o nativo digitale
            è stato creato o registrato. La data di una digitalizzazione successiva
            non viene registrata qui.
        name:
          de: Erstellungsdatum
          en: Date created
          fr: Date de création
          it: Data di creazione
        order: 9.0
        to_class: oldap:Dating
      - iri: fasnacht:location
        description:
          de: Ort, an dem das Medium aufgenommen wurde.
          en: Location where the media has been recorded.
          fr: Lieu où le support a été enregistré.
          it: Luogo in cui è stato registrato il materiale.
        max_count: 1
        name:
          de: Ort
          en: Location
          fr: Lieu
          it: Luogo
        order: 8.0
        to_class: fasnacht:Place
      - iri: fasnacht:publicationStatus
        description:
          de: Redaktioneller Workflow-Status, der angibt, ob die Archivressource noch
            bearbeitet wird, zur Publikation bereit ist oder öffentlich publiziert
            ist.
          en: Editorial workflow status controlling whether the archival resource
            is still being edited, ready for publication, or publicly published.
        max_count: 1
        min_count: 1
        name:
          de: Publikationsstatus
          en: Publication status
          fr: Statut de publication
          it: Stato di pubblicazione
        order: 3.0
        to_class: list:PublicationStatus
      - iri: fasnacht:representationRole
        description:
          de: Funktionale Rolle dieses Archivmediums innerhalb eines Archiveintrags
            oder einer Gruppe zusammengehörender Medien, beispielsweise als selbständige
            Mediendarstellung, repräsentative Ansicht, Bestandteil, Detailansicht,
            Nutzungsfassung oder ergänzendes Material.
          en: Functional role of this archive media item within an archival entry
            or a group of related media, such as an independent representation, representative
            view, component, detail view, access copy, or supplementary material.
          fr: Rôle fonctionnel de cet objet média d’archive au sein d’une notice d’archive
            ou d’un groupe de médias associés, par exemple comme représentation autonome,
            vue représentative, composant, vue de détail, copie de consultation ou
            matériel complémentaire.
          it: Ruolo funzionale di questo oggetto multimediale d’archivio all’interno
            di una scheda d’archivio o di un gruppo di media correlati, per esempio
            come rappresentazione autonoma, vista rappresentativa, componente, vista
            di dettaglio, copia di consultazione o materiale supplementare.
        max_count: 1
        name:
          de: Rolle der Mediendarstellung
          en: Representation role
          fr: Rôle de la représentation
          it: Ruolo della rappresentazione
        order: 4.0
        to_class: list:MediumRepresentationTaxonomy
      - iri: fasnacht:representedEventType
        description:
          de: Arten von Fasnachtsanlässen, die in diesem Archivmedium erkennbar, dargestellt,
            hörbar oder inhaltlich behandelt werden, ohne dass damit ein konkret identifizierter
            CarnivalEvent behauptet oder vorausgesetzt wird.
          en: Carnival event types recognisable, depicted, heard, or discussed in
            this archive media item without asserting or requiring a link to a specifically
            identified CarnivalEvent.
          fr: Types d'événements carnavalesques reconnaissables, représentés, audibles
            ou traités dans ce média d'archive, sans affirmer ni exiger un lien vers
            un CarnivalEvent précisément identifié.
          it: Tipi di eventi carnevaleschi riconoscibili, raffigurati, udibili o trattati
            in questo oggetto multimediale d'archivio, senza affermare o richiedere
            un collegamento a un CarnivalEvent identificato con precisione.
        name:
          de: Erkennbare oder behandelte Fasnachtsanlassart
          en: Recognisable or discussed carnival event type
          fr: Type d'événement carnavalesque reconnaissable ou traité
          it: Tipo di evento carnevalesco riconoscibile o trattato
        order: 9.0
        to_class: list:CarnivalEventTaxonomy
      - iri: fasnacht:representedObjectType
        description:
          de: Objektarten, die in diesem Archivmedium erkennbar, dargestellt oder
            inhaltlich behandelt werden, ohne dass damit ein konkret identifiziertes
            ArchiveObject behauptet oder vorausgesetzt wird.
          en: Object types recognisable, depicted, or discussed in this archive media
            item without asserting or requiring a link to a specifically identified
            ArchiveObject.
          fr: Types d'objets reconnaissables, représentés ou traités dans ce média
            d'archive, sans affirmer ni exiger un lien vers un ArchiveObject précisément
            identifié.
          it: Tipi di oggetti riconoscibili, raffigurati o trattati in questo oggetto
            multimediale d'archivio, senza affermare o richiedere un collegamento
            a un ArchiveObject identificato con precisione.
        name:
          de: Dargestellte oder behandelte Objektart
          en: Depicted or discussed object type
          fr: Type d'objet représenté ou traité
          it: Tipo di oggetto raffigurato o trattato
        order: 8.0
        to_class: list:ObjectTaxonomy
      - iri: fasnacht:rightsStatementUrl
        datatype: xsd:anyURI
        max_count: 1
        name:
          de: Andere Rechteerklärung
          en: Other Rights Statement
          fr: Autre Déclaration de droits
          it: Altre dichiarazioni sui diritti
        order: 13.0
      - iri: fasnacht:searchableText
        datatype: xsd:string
        description:
          en: Unreviewed document text for search, derived from embedded PDF text
            or OCR. Separate from editorial metadata; source pages and extraction
            provenance are in textExtraction.
        max_count: 1
        name:
          de: Automatisch gewonnener Suchtext
          en: Automatically extracted search text
        order: 2.1
      - iri: fasnacht:textExtraction
        datatype: xsd:string
        description:
          en: Versioned JSON with source URL and SHA-256, extractor/model versions,
            unreviewed status, and per-page original text, method and failures. Updated
            atomically with searchableText.
        max_count: 1
        name:
          de: Herkunft des automatisch gewonnenen Dokumenttexts
          en: Document text extraction provenance
        order: 2.2
      - iri: schema:description
        datatype: rdf:langString
        description:
          de: Beschreibung der Mediendarstellung und dessen, was sie am Archivobjekt
            zeigt.
          en: Description of the media representation and what it shows about the
            archival object.
          fr: Description de la représentation média et de ce qu'elle montre de l'objet
            d'archive.
          it: Descrizione della rappresentazione multimediale e di ciò che mostra
            dell'oggetto d'archivio.
        editor: TEXT_AREA_WITH_LANG
        name:
          de: Beschreibung
          en: Description
          fr: Description
          it: Descrizione
        order: 2.0
      - iri: schema:name
        datatype: rdf:langString
        description:
          de: Titel oder vergebener Name einer digitalen Mediendarstellung im Archiv.
          en: Title or assigned name of a digital media representation in the archive.
          fr: Titre ou nom attribué à une représentation média numérique dans l'archive.
          it: Titolo o nome attribuito a una rappresentazione multimediale digitale
            nell'archivio.
        editor: TEXT_FIELD_WITH_LANG
        min_count: 1
        name:
          de: Titel
          en: Title
          fr: Titre
          it: Titolo
        order: 1.0
      - iri: schema:position
        datatype: xsd:integer
        name:
          de: Position/Sequenznummer/Seite
          en: Position/sequence number
          fr: Position
          it: Posizione
        order: 14.0
    fasnacht:ArchiveObject:
      label:
        de: ArchivObject
        en: Archival object
      superclass:
      - fasnacht:CarnivalThing
      - schema:CreativeWork
      properties:
      - iri: dcterms:creator
        description:
          de: Person oder Organisation, die das Archivobjekt entworfen, hergestellt,
            geschrieben, herausgegeben oder anderweitig geschaffen hat.
          en: Person or organisation that designed, made, wrote, published, or otherwise
            created the archival object.
          fr: Personne ou organisation qui a conçu, fabriqué, écrit, publié ou autrement
            créé l'objet d'archive.
          it: Persona o organizzazione che ha progettato, realizzato, scritto, pubblicato
            o creato in altro modo l'oggetto d'archivio.
        name:
          de: Urheber
          en: Creator
          fr: Auteur
          it: Autore
        order: 2.0
        to_class: fasnacht:Agent
      - iri: dcterms:provenance
        datatype: rdf:langString
        description:
          de: Provenienz, Besitzgeschichte oder Erwerbungskontext des Archivobjekts.
          en: Provenance, ownership history, or acquisition context of the archival
            object.
          fr: Provenance, historique de propriété ou contexte d'acquisition de l'objet
            d'archive.
          it: Provenienza, storia della proprietà o contesto di acquisizione dell'oggetto
            d'archivio.
        editor: TEXT_FIELD_WITH_LANG
        name:
          de: Provenienz
          en: Provenance
          fr: Provenance
          it: Provenienza
        order: 4.0
      - iri: dcterms:type
        description:
          de: Objekttyp zur Klassifikation eines Archivobjekts, etwa Kostüm, Maske,
            Dokument oder Requisit.
          en: Object type used to classify an archival object, such as costume, mask,
            document, or prop.
          fr: Type d'objet servant à classer un objet d'archive, par exemple costume,
            masque, document ou accessoire.
          it: Tipo di oggetto usato per classificare un oggetto d'archivio, per esempio
            costume, maschera, documento o accessorio.
        max_count: 1
        min_count: 1
        name:
          de: Art
          en: Type
          fr: Type
          it: Tipo
        order: 1.0
        to_class: list:ObjectTaxonomy
      - iri: fasnacht:currentCustodian
        description:
          de: Person oder Organisation, die das Objekt derzeit physisch verwahrt oder
            aufbewahrt.
          en: Person or organisation currently holding or physically preserving the
            object.
          fr: Personne ou organisation qui conserve ou détient actuellement l’objet
            physiquement.
          it: Persona o organizzazione che conserva o detiene attualmente l’oggetto
            fisicamente.
        max_count: 1
        name:
          de: Aktuelle Verwahrerin / aktueller Verwahrer
          en: Current custodian
          fr: Détenteur actuel
          it: Detentore attuale
        order: 3.0
        to_class: fasnacht:Agent
      - iri: fasnacht:externalSource
        description:
          de: Externe Quelle des Objekts. Nur bei externen Archivobjekten.
          en: External source of the object. Only for external archive objects.
          fr: Source externe de l'objet. Uniquement pour les objets d'archivage externes.
          it: Fonte esterna dell'oggetto. Solo per gli oggetti di archivio esterni.
        max_count: 1
        name:
          de: Externe Quelle
          en: External source
          fr: Source externe
          it: Fonte esterna
        order: 8.0
        to_class: fasnacht:ExternalSource
      - iri: fasnacht:usedAt
        description:
          de: Datum oder Zeitraum, in dem das Archivobjekt in der Fasnachtspraxis
            verwendet wurde.
          en: Date or period when the archival object was used in Fasnacht practice.
          fr: Date ou période durant laquelle l'objet d'archive a été utilisé dans
            la pratique carnavalesque.
          it: Data o periodo in cui l'oggetto d'archivio è stato usato nella pratica
            del Carnevale.
        name:
          de: Verwendet am
          en: Used at
          fr: Utilisé le
          it: Usato il
        order: 5.0
        to_class: oldap:Dating
      - iri: schema:identifier
        datatype: xsd:string
        description:
          de: Archivkennung, Signatur oder Standortangabe zum Auffinden des Objekts.
          en: Archive identifier, shelfmark, or signature used to find the object.
          fr: Identifiant d'archive, cote ou signature permettant de retrouver l'objet.
          it: Identificativo d'archivio, segnatura o collocazione per ritrovare l'oggetto.
        max_count: 1
        name:
          de: Signatur
          en: Identifier
          fr: Cote
          it: Segnatura
        order: 6.0
      - iri: schema:url
        datatype: xsd:anyURI
        description:
          de: URL des Objekts auf der Website des Anbieters. Nur bei externen Archivobjekten.
          en: URL of the object at the provider's website. Only for external archive
            objects.
          fr: URL de l'objet sur le site web du fournisseur. Uniquement pour les objets
            d'archivage externes.
          it: URL dell'oggetto sul sito web del fornitore. Solo per gli oggetti di
            archivio esterni.
        max_count: 1
        name:
          de: URL des Objekts auf der Website des Anbieters
          en: URL of the object at the provider's website
          fr: URL de l'objet sur le site web du fournisseur
          it: URL dell'oggetto sul sito web del fornitore
        order: 7.0
    fasnacht:CarnivalEvent:
      label:
        de: Fasnachtsanlass
        en: Carnival event
        fr: Evenement de carnaval
        it: Evento di Carnevale
      superclass:
      - fasnacht:CarnivalThing
      - schema:Event
      properties:
      - iri: dcterms:type
        description:
          de: Gibt den Typ des Fasnachtsanlasses an.
          en: Indicates the type of the carnival event.
          fr: Indique le type de l'évenement de carnaval.
          it: Indica il tipo dell'evento di Carnevale.
        name:
          de: Typ
          en: Type
          fr: Type
          it: Tipo
        order: 1.0
        to_class: list:CarnivalEventTaxonomy
    fasnacht:CarnivalThing:
      label:
        de: Fasnachts-Objekt / Fasnachts-Ereignis
        en: Carnival Thing (an object or an event)
        fr: Objet ou évenement de carnaval
        it: Oggetto/evento di Carnevale
      properties:
      - iri: dcterms:isPartOf
        description:
