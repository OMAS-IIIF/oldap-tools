    fasnacht:CarnivalThing:
      label:
        en: Carnival Thing (an object or an event)
        de: Fasnachts-Objekt / Fasnachts-Ereignis
        fr: Objet ou évenement de carnaval
        it: Oggetto/evento di Carnevale
      properties:
        - iri: schema:name
          datatype: rdf:langString
          name:
            en: Name
            de: Name
            fr: Nom
            it: Nome
          description:
            en: Name of the carnival thing, such as a festival, exhibition, or event.
            de: Name des Fasnachts-Objekts oder -Ereignis, z.B. eine Laterne, ein Fasnachtsanlass etc.
            fr: Nom de l'objet de carnaval, tel qu'un festival, une exposition ou un événement.
            it: Nome dell'oggetto di Carnevale, come un festival, un'esposizione o un evento.
          min_count: 1
          editor: TEXT_FIELD_WITH_LANG
          order: 1
        - iri: schema:description
          datatype: rdf:langString
          name:
            en: Description
            de: Beschreibung
            fr: Description
            it: Descrizione
          description:
            en: Description or summary of the carnival thing, such as a festival, exhibition, or event.
            de: Beschreibung oder Zusammenfassung des Fasnachts-Objekts oder -Ereignis, z.B. eine Laterne, ein Fasnachtsanlass etc.
            fr: Description ou résumé de l'objet de carnaval, tel qu'un festival, une exposition ou un événement.
            it: Descrizione o sintesi dell'oggetto di Carnevale, come un festival, un'esposizione o un evento.
          editor: TEXT_AREA_WITH_LANG
          order: 2
        - iri: fasnacht:dating
          to_class: oldap:Dating
          name:
            en: Date created / event date
            de: Erstellungsdatum / Eventdateum
            fr: Date de création / de l'événement
            it: Data di creazione / data dell'evento'
          description:
            en: Dating information for the creation or production of the archival object.
            de: Datierungsangaben zur Entstehung oder Herstellung des Fasnachtsding.
            fr: Informations de datation sur la création ou la production de l'objet d'archive.
            it: Informazioni di datazione sulla creazione o produzione dell'oggetto d'archivio.
          order: 3
        - iri: fasnacht:associatedOrganisation
          to_class: fasnacht:Agent
          name:
            en: Associated organisation/institution
            de: Mit Organisation/Einrichtung verbunden
            fr: Lié à l'organisation/à l'établissement
            it: Relativo all'organizzazione/all'allestimento
          order: 4
        - iri: fasnacht:connectedToOrganisationTaxonomy
          to_class: list:OrganisationTaxonomy
          name:
            en: Connected to organisation taxonomy
            de: Verknüpft mit Organisationseinheit
            fr: Connecté à la taxonomie d'organisation
            it: Connesso alla taxonomia di organizzazione
          description:
            en: Indicates the organisation taxonomy to which this media item is connected.
            de: Gibt die Organisationseinheit an, mit der dieses Medienobjekt verbunden ist.
            fr: Indique la taxonomie d'organisation à laquelle cet objet média est connecté.
            it: Indica la taxonomia di organizzazione a cui questo oggetto multimediale è connesso.
          order: 5
        - iri: dcterms:isPartOf
          to_class: fasnacht:CarnivalThing
          inverse_of: dcterms:hasPart
          name:
            en: Part of
            de: Teil von
            fr: Fait partie de
            it: Fa parte di
          description:
            en: Indicates that the archival object is part of a larger carnival thing, such as a festival, exhibition, or event.
            de: Gibt an, dass das Fasnachtsding Teil eines größeren Fasnachtsding ist, z. B. eines Festivals, einer Ausstellung oder eines Ereignisses.
            fr: Indique que l'objet d'archive fait partie d'un objet de carnaval plus grand, tel qu'un festival, une exposition ou un événement.
            it: Indica che l'oggetto d'archivio fa parte di un oggetto di Carnevale più grande, come un festival, un'esposizione o un evento.
          order: 6
        - iri: dcterms:hasPart
          to_class: fasnacht:CarnivalThing
          inverse_of: dcterms:isPartOf
          name:
            en: Has part
            de: Hat Teil
            fr: A une partie
            it: Ha parte
          description:
            en: Indicates that the archival object is part of a larger carnival thing, such as a festival, exhibition, or event.
            de: Gibt an, dass das Fasnachtsding Teil eines größeren Fasnachtsding ist, z. B. eines Festivals, einer Ausstellung oder eines Ereignisses.
            fr: Indique que l'objet d'archive fait partie d'un objet de carnaval plus grand, tel qu'un festival, une exposition ou un événement.
            it: Indica che l'oggetto d'archivio fa parte di un oggetto di Carnevale più grande, come un festival, un'esposizione o un evento.
          order: 7
        - iri: fasnacht:location
          to_class: fasnacht:Place
          name:
            en: Location
            de: Ort
            fr: Lieu
            it: Luogo
          description:
            en: Indicates the location of the event or the current place of the archival object.
            de: Gibt den Ort des Ereignisses oder den aktuellen Standort des Archivobjekts an.
            fr: Indique le lieu de l'événement ou l'emplacement actuel de l'objet d'archivage.
            it: Indica la località dell'oggetto d'archivio.
          order: 8

