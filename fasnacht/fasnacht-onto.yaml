            fr: Licence Creative Commons proposée pour les médias d'archive créés à partir de cette zone de préparation. La valeur initialement configurée est CC BY-ND et peut être vérifiée avant publication.
            it: Licenza Creative Commons proposta per i media d'archivio creati da quest'area di preparazione. Il valore inizialmente configurato è CC BY-ND e può essere verificato prima della pubblicazione.
