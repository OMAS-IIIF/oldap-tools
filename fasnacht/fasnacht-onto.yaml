          de: Funktionale Rolle dieses Archivmediums innerhalb eines Archiveintrags oder einer Gruppe zusammengehörender Medien, beispielsweise als selbständige Mediendarstellung, repräsentative Ansicht, Bestandteil, Detailansicht, Nutzungsfassung oder ergänzendes Material.
          fr: Rôle fonctionnel de cet objet média d’archive au sein d’une notice d’archive ou d’un groupe de médias associés, par exemple comme représentation autonome, vue représentative, composant, vue de détail, copie de consultation ou matériel complémentaire.
          it: Ruolo funzionale di questo oggetto multimediale d’archivio all’interno di una scheda d’archivio o di un gruppo di media correlati, per esempio come rappresentazione autonoma, vista rappresentativa, componente, vista di dettaglio, copia di consultazione o materiale supplementare.
        max_count: 1
        order: 4
      - iri: fasnacht:archiveMediaObjectOf
        to_class: fasnacht:CarnivalThing
        name:
          en: Represents archive object/event
          de: Medium (Bild, Video, Ton etc.), das ein "Fasnachtsding" (Objekt, Anlass) darstellt
          fr: Représente l'objet d'archive
          it: Rappresenta oggetto d'archivio
        description:
          en: Optional archive objects or carnival events depicted, digitised, or otherwise represented by this media item.
          de: Optionale Archivobjekte oder Fasnachtsanlässe, die durch dieses Medienobjekt abgebildet, digitalisiert oder anderweitig repräsentiert werden.
          fr: Objets d'archive ou événements carnavalesques facultatifs représentés, numérisés ou autrement documentés par cet objet média.
          it: Oggetti d'archivio o eventi carnevaleschi facoltativi raffigurati, digitalizzati o altrimenti rappresentati da questo oggetto multimediale.
        order: 5
      - iri: fasnacht:carnivalPractice
        to_class: list:CarnivalPracticeTaxonomy
        name:
          en: Carnival practice
          de: Praxis / Handlung
          fr: Pratique carnavalesque
          it: Pratica carnevalesca
        description:
          en: Cultural practices or forms of expression directly depicted or addressed by this archive media item.
          de: Kulturelle Praktiken oder Ausdrucksformen, die dieses Archivmedium direkt darstellt oder behandelt.
          fr: Pratiques culturelles ou formes d'expression directement représentées ou abordées par cet objet média d'archive.
          it: Pratiche culturali o forme di espressione direttamente rappresentate o trattate da questo oggetto multimediale d'archivio.
        order: 6
      - iri: fasnacht:carnivalGrouping
        to_class: list:CarnivalGroupingTaxonomy
        name:
          en: Depicted or discussed carnival grouping
          de: Dargestellte oder behandelte Fasnachtsgruppierung
          fr: Groupement carnavalesque représenté ou traité
          it: Gruppo carnevalesco raffigurato o trattato
        description:
          en: Types of carnival actors or formations depicted, heard, or discussed in this archive media item. This is distinct from a specifically identified associated organisation and from authorship, deposit, or custody.
          de: Arten von Fasnachtsakteuren oder Formationen, die in diesem Archivmedium dargestellt, hörbar oder inhaltlich behandelt werden. Dies ist von einer konkret identifizierten verbundenen Organisation sowie von Urheberschaft, Ablieferung und Verwahrung zu unterscheiden.
          fr: Types d'acteurs ou de formations carnavalesques représentés, audibles ou traités dans ce média d'archive. Cette indication se distingue d'une organisation associée précisément identifiée ainsi que de la création, du dépôt et de la conservation.
          it: Tipi di attori o formazioni carnevalesche raffigurati, udibili o trattati in questo oggetto multimediale d'archivio. Questa indicazione è distinta da un'organizzazione associata identificata e dalla paternità, dal deposito o dalla custodia.
        order: 7
      - iri: fasnacht:representedObjectType
        to_class: list:ObjectTaxonomy
        name:
          en: Depicted or discussed object type
          de: Dargestellte oder behandelte Objektart
          fr: Type d'objet représenté ou traité
          it: Tipo di oggetto raffigurato o trattato
        description:
          en: Object types recognisable, depicted, or discussed in this archive media item without asserting or requiring a link to a specifically identified ArchiveObject.
          de: Objektarten, die in diesem Archivmedium erkennbar, dargestellt oder inhaltlich behandelt werden, ohne dass damit ein konkret identifiziertes ArchiveObject behauptet oder vorausgesetzt wird.
          fr: Types d'objets reconnaissables, représentés ou traités dans ce média d'archive, sans affirmer ni exiger un lien vers un ArchiveObject précisément identifié.
          it: Tipi di oggetti riconoscibili, raffigurati o trattati in questo oggetto multimediale d'archivio, senza affermare o richiedere un collegamento a un ArchiveObject identificato con precisione.
        order: 8
      - iri: fasnacht:representedEventType
        to_class: list:CarnivalEventTaxonomy
        name:
          en: Recognisable or discussed carnival event type
          de: Erkennbare oder behandelte Fasnachtsanlassart
          fr: Type d'événement carnavalesque reconnaissable ou traité
          it: Tipo di evento carnevalesco riconoscibile o trattato
        description:
          en: Carnival event types recognisable, depicted, heard, or discussed in this archive media item without asserting or requiring a link to a specifically identified CarnivalEvent.
          de: Arten von Fasnachtsanlässen, die in diesem Archivmedium erkennbar, dargestellt, hörbar oder inhaltlich behandelt werden, ohne dass damit ein konkret identifizierter CarnivalEvent behauptet oder vorausgesetzt wird.
          fr: Types d'événements carnavalesques reconnaissables, représentés, audibles ou traités dans ce média d'archive, sans affirmer ni exiger un lien vers un CarnivalEvent précisément identifié.
          it: Tipi di eventi carnevaleschi riconoscibili, raffigurati, udibili o trattati in questo oggetto multimediale d'archivio, senza affermare o richiedere un collegamento a un CarnivalEvent identificato con precisione.
        order: 9
      - iri: fasnacht:associatedOrganisation
        to_class: fasnacht:Agent
        name:
          en: Depicted or associated organisation
          de: Dargestellte oder inhaltlich verbundene Organisation
          fr: Organisation représentée ou associée
          it: Organizzazione rappresentata o associata
        description:
          en: Organisations or institutions depicted by the media item or directly relevant to its content. This is distinct from the agent that provided the file.
          de: Organisationen oder Institutionen, die im Medium dargestellt werden oder für dessen Inhalt unmittelbar relevant sind. Dies ist nicht die Angabe, wer die Datei bereitgestellt hat.
          fr: Organisations ou institutions représentées dans le média ou directement concernées par son contenu. Cette propriété est distincte de l'agent ayant fourni le fichier.
          it: Organizzazioni o istituzioni rappresentate nel media o direttamente rilevanti per il suo contenuto. Questa proprietà è distinta dall'agente che ha fornito il file.
        order: 10
      - iri: fasnacht:location
        to_class: fasnacht:Place
        name:
          en: Location
          de: Ort
          fr: Lieu
          it: Luogo
        description:
          en: Location where the media has been recorded.
          de: Ort, an dem das Medium aufgenommen wurde.
          fr: Lieu où le support a été enregistré.
          it: Luogo in cui è stato registrato il materiale.
        max_count: 1
        order: 11
      - iri: fasnacht:creationDating
        to_class: oldap:Dating
        name:
          en: Date created
          de: Erstellungsdatum
          fr: Date de création
          it: Data di creazione
        description:
          en: Date on which the original analogue or born-digital media content was created or recorded. A later digitisation date is not recorded here.
          de: Datum, an dem der ursprüngliche analoge oder digital entstandene Medieninhalt geschaffen oder aufgenommen wurde. Ein späteres Digitalisierungsdatum wird hier nicht erfasst.
          fr: Date à laquelle le contenu média analogique original ou né numérique a été créé ou enregistré. La date d'une numérisation ultérieure n'est pas enregistrée ici.
          it: Data in cui il contenuto multimediale analogico originale o nativo digitale è stato creato o registrato. La data di una digitalizzazione successiva non viene registrata qui.
        order: 12
      - iri: fasnacht:contributingAgent
        subproperty_of: schema:provider
        to_class: fasnacht:Agent
        name:
          en: Provided by
          de: Zur Verfügung gestellt von
          fr: Mis à disposition par
          it: Messo a disposizione da
        description:
          en: Organisation or person that provided the digital resource to the project. This refers to the source of the digital item or file and does not necessarily indicate authorship or ownership of the original object.
          de: Organisation oder Person, die die digitale Ressource dem Projekt zur Verfügung gestellt hat. Dies bezeichnet die Herkunft des Digitalisats oder der digitalen Datei, nicht notwendigerweise die Urheberschaft oder das Eigentum am ursprünglichen Objekt.
          fr: Organisation ou personne ayant mis la ressource numérique à disposition du projet. Cela désigne la provenance du document numérique ou du fichier numérique, sans indiquer nécessairement la paternité ou la propriété de l’objet original.
          it: Organizzazione o persona che ha messo la risorsa digitale a disposizione del progetto. Questo indica la provenienza del documento o file digitale e non implica necessariamente la paternità o la proprietà dell’oggetto originale.
        min_count: 1
        max_count: 1
        order: 13
      - iri: dcterms:creator
        to_class: fasnacht:Agent
        name:
          en: Creator
          de: Urheber
          fr: Auteur
          it: Autore
        description:
          en: Person or organisation that created the archive media item.
          de: Person oder Organisation, die das Archivmedienobjekt erstellt hat.
          fr: Personne ou organisation qui a créé l'objet média d'archive.
          it: Persona o organizzazione che ha creato l'oggetto multimediale d'archivio.
        order: 14
      - iri: dcterms:rights
        to_class: list:CreativeCommons
        name:
          en: Licence
          de: Lizenz
          fr: Licence
          it: Licenza
        description:
          en: Rights or licence governing reuse of the archive media item.
          de: Rechte oder Lizenz, welche die Nachnutzung des Archivmedienobjekts regeln.
          fr: Droits ou licence régissant la réutilisation de l'objet média d'archive.
          it: Diritti o licenza che regolano il riuso dell'oggetto multimediale d'archivio.
        min_count: 1
        max_count: 1
        order: 15
      - iri: fasnacht:rightsStatementUrl
        datatype: xsd:anyURI
        name:
          en: Other Rights Statement
          de: Andere Rechteerklärung
          fr: Autre Déclaration de droits
          it: Altre dichiarazioni sui diritti
        max_count: 1
        order: 16
      - iri: schema:position
        datatype: xsd:integer
        name:
          en: Position/sequence number
          de: Position/Sequenznummer/Seite
          fr: Position
          it: Posizione
        order: 17

