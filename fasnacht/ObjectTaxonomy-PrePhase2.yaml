        - Fasnachtstexte und Musiknotation@de
        - Textes carnavalesques et notation musicale@fr
        - Testi carnevaleschi e notazione musicale@it
      definition:
        - Written creative source material and notation produced for carnival performance, presentation, or musical practice.@en
        - Schriftliches kreatives Quellenmaterial und Notation für Aufführung, Präsentation oder musikalische Praxis der Fasnacht.@de
        - Matériaux créatifs écrits et notations produits pour la représentation, la présentation ou la pratique musicale du carnaval.@fr
        - Materiali creativi scritti e notazioni prodotti per l'esecuzione, la presentazione o la pratica musicale del carnevale.@it
      nodes:
        Zeedel:
          label:
            - Carnival leaflet (Zeedel)@en
            - Zeedel@de
