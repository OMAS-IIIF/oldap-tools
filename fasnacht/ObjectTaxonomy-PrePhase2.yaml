            - Spartito musicale@it

    Kunst:
      label:
        - Visual and design works@en
        - Bild- und Gestaltungswerke@de
        - Œuvres visuelles et de conception@fr
        - Opere visive e di progettazione@it
      definition:
        - Independent visual works and design sources, whether unique originals or separately preserved analogue photographic objects.@en
        - Eigenständige Bildwerke und Gestaltungsquellen, sowohl einzigartige Originale als auch separat erhaltene analoge fotografische Objekte.@de
        - Œuvres visuelles et sources de conception autonomes, qu'il s'agisse d'originaux uniques ou d'objets photographiques analogiques conservés séparément.@fr
        - Opere visive e fonti progettuali autonome, siano esse originali unici o oggetti fotografici analogici conservati separatamente.@it
      nodes:
        Helge:
          label:
            - Schnitzelbank illustration board (Helge)@en
            - Helge@de
            - Planche illustrée de Schnitzelbank (Helge)@fr
            - Tavola illustrata di Schnitzelbank (Helge)@it
          definition:
            - A physical illustrated board or sheet used to accompany a Schnitzelbank performance.@en
            - Eine physische illustrierte Tafel oder ein Blatt zur Begleitung eines Schnitzelbankvortrags.@de
            - Une planche ou feuille physique illustrée utilisée pour accompagner une représentation de Schnitzelbank.@fr
            - Una tavola o un foglio fisico illustrato usato per accompagnare un'esibizione di Schnitzelbank.@it
        DesignOrSketch:
          label:
            - Design or sketch@en
            - Entwurf oder Skizze@de
            - Projet ou esquisse@fr
            - Progetto o schizzo@it
        IllustrationOrGraphicWork:
          label:
            - Illustration or graphic work@en
            - Illustration oder Grafik@de
            - Illustration ou œuvre graphique@fr
            - Illustrazione o opera grafica@it
        Painting:
          label:
            - Painting@en
            - Gemälde@de
            - Peinture@fr
            - Dipinto@it
        AnalogPhotograph:
          label:
            - Analogue photograph@en
            - Analoge Fotografie@de
            - Photographie analogique@fr
            - Fotografia analogica@it
          definition:
            - A physical photographic archival item such as a print, negative, or slide. A digital scan or digital photograph is described separately as an ArchiveMediaObject.@en
            - Ein physischer fotografischer Archivgegenstand wie ein Abzug, Negativ oder Dia. Ein digitaler Scan oder eine digitale Fotografie wird separat als ArchiveMediaObject beschrieben.@de
            - Un objet photographique physique tel qu'un tirage, un négatif ou une diapositive. Une numérisation ou une photographie numérique est décrite séparément comme ArchiveMediaObject.@fr
            - Un oggetto fotografico fisico come una stampa, un negativo o una diapositiva. Una scansione o una fotografia digitale è descritta separatamente come ArchiveMediaObject.@it

    MusicalWorks:
      label:
        - Musical works@en
        - Musikalische Werke@de
        - Œuvres musicales@fr
        - Opere musicali@it
      definition:
        - Intellectually independent musical compositions, distinct from their notation, recordings, and physical sound carriers.@en
        - Geistig eigenständige musikalische Kompositionen, unterschieden von ihrer Notation, ihren Aufnahmen und ihren physischen Tonträgern.@de
        - Compositions musicales intellectuellement autonomes, distinctes de leur notation, de leurs enregistrements et de leurs supports sonores physiques.@fr
        - Composizioni musicali intellettualmente autonome, distinte dalla loro notazione, dalle registrazioni e dai supporti sonori fisici.@it
      nodes:
        Marsch:
          label:
            - March or composition@en
            - Marsch oder Komposition@de
            - Marche ou composition@fr
            - Marcia o composizione@it
        OtherMusicalWork:
          label:
            - Other musical work@en
            - Anderes musikalisches Werk@de
            - Autre œuvre musicale@fr
            - Altra opera musicale@it

    AnalogMediaAndCarriers:
      label:
        - Analogue media and carriers@en
        - Analoge Medien und Datenträger@de
        - Médias et supports analogiques@fr
        - Media e supporti analogici@it
      definition:
        - Physical analogue carriers on which sound, moving images, or other recorded information is stored. A digitisation of their content is an ArchiveMediaObject.@en
        - Physische analoge Träger, auf denen Ton, Bewegtbild oder andere aufgezeichnete Informationen gespeichert sind. Ein Digitalisat ihres Inhalts ist ein ArchiveMediaObject.@de
        - Supports analogiques physiques sur lesquels sont enregistrés du son, des images animées ou d'autres informations. Une numérisation de leur contenu est un ArchiveMediaObject.@fr
        - Supporti analogici fisici sui quali sono registrati suoni, immagini in movimento o altre informazioni. Una digitalizzazione del loro contenuto è un ArchiveMediaObject.@it
      nodes:
        PhonographRecord:
          label:
            - Phonograph record@en
            - Schallplatte@de
            - Disque phonographique@fr
            - Disco fonografico@it
        MagneticTape:
          label:
            - Magnetic tape@en
            - Tonband@de
            - Bande magnétique@fr
            - Nastro magnetico@it
        AudioCassette:
          label:
            - Audio cassette@en
            - Kassette@de
            - Cassette audio@fr
            - Audiocassetta@it
        FilmCarrier:
          label:
            - Film carrier@en
            - Filmträger@de
            - Support filmique@fr
            - Supporto filmico@it
        OtherAnalogCarrier:
          label:
            - Other analogue carrier@en
            - Anderer analoger Datenträger@de
            - Autre support analogique@fr
            - Altro supporto analogico@it

    Memorabilia:
      label:
        - Memorabilia and collectibles@en
        - Erinnerungs- und Sammlungsstücke@de
        - Souvenirs et objets de collection@fr
        - Cimeli e oggetti da collezione@it
      definition:
        - Keepsakes and collected objects whose archival significance primarily lies in their association with carnival history, people, or organisations.@en
        - Erinnerungs- und Sammlungsstücke, deren archivische Bedeutung vor allem in ihrer Verbindung mit Fasnachtsgeschichte, Personen oder Organisationen liegt.@de
        - Souvenirs et objets de collection dont l'importance archivistique réside principalement dans leur lien avec l'histoire, les personnes ou les organisations du carnaval.@fr
        - Cimeli e oggetti da collezione la cui importanza archivistica risiede soprattutto nel legame con la storia, le persone o le organizzazioni del carnevale.@it

    Other:
      label:
        - Other archive material type@en
        - Andere Archivgutart@de
        - Autre type de document ou objet d'archive@fr
        - Altro tipo di materiale d'archivio@it
      definition:
        - The archive material type is known but is not covered by the available categories.@en
        - Die Archivgutart ist bekannt, wird aber durch die vorhandenen Kategorien nicht abgedeckt.@de
        - Le type de document ou d'objet d'archive est connu mais n'est pas couvert par les catégories disponibles.@fr
        - Il tipo di materiale d'archivio è noto ma non è coperto dalle categorie disponibili.@it

    Undetermined:
      label:
        - Archive material type not yet determined@en
        - Archivgutart noch nicht bestimmt@de
        - Type de document ou objet d'archive pas encore déterminé@fr
        - Tipo di materiale d'archivio non ancora determinato@it
      definition:
        - The archive material type has not yet been identified. This is a temporary editorial classification, not a substitute for Other.@en
        - Die Archivgutart wurde noch nicht bestimmt. Dies ist eine vorläufige redaktionelle Klassifikation und kein Ersatz für Andere Archivgutart.@de
        - Le type de document ou d'objet d'archive n'a pas encore été identifié. Il s'agit d'une classification éditoriale provisoire et non d'un substitut à l'autre type d'archive.@fr
        - Il tipo di materiale d'archivio non è ancora stato identificato. Si tratta di una classificazione editoriale provvisoria e non sostituisce l'altro tipo di materiale d'archivio.@it
