            - Correspondence@en
            - Korrespondenz@de
            - Correspondance@fr
            - Corrispondenza@it
        FinancialRecords:
          label:
            - Financial records@en
            - Finanzunterlagen@de
            - Documents financiers@fr
            - Documenti finanziari@it
        StatutesAndRegulations:
          label:
            - Statutes and regulations@en
            - Statuten und Reglemente@de
            - Statuts et règlements@fr
            - Statuti e regolamenti@it
        OtherClubRecords:
          label:
            - Other club records@en
            - Andere Vereinsunterlagen@de
            - Autres documents associatifs@fr
            - Altri documenti associativi@it

    PublicationsAndPress:
      label:
        - Publications and press@en
        - Publikationen und Presse@de
        - Publications et presse@fr
        - Pubblicazioni e stampa@it
      definition:
        - Published or publicly distributed printed works and press materials.@en
        - Veröffentlichte oder öffentlich verbreitete Druckwerke und Pressematerialien.@de
        - Ouvrages imprimés publiés ou diffusés publiquement et documents de presse.@fr
        - Opere a stampa pubblicate o diffuse pubblicamente e materiali di stampa.@it
      nodes:
        Buch:
          label:
            - Book@en
            - Buch@de
            - Livre@fr
            - Libro@it
        Chronik:
          label:
            - Chronicle@en
            - Chronik@de
            - Chronique@fr
            - Cronaca@it
        Magazin:
          label:
            - Periodical or magazine@en
            - Zeitschrift oder Magazin@de
            - Périodique ou magazine@fr
            - Periodico o rivista@it
        ProgrammeAndEventGuide:
          label:
            - Programme and event guide@en
            - Programm- und Veranstaltungsführer@de
            - Programme et guide de manifestation@fr
            - Programma e guida dell'evento@it
          definition:
            - An official or editorially responsible publication containing programme information, participants, themes, routes, schedules, and organisational guidance for an event.@en
            - Eine offizielle oder redaktionell verantwortete Publikation mit Programminformationen, Teilnehmenden, Themen, Routen, Zeiten und organisatorischen Hinweisen zu einer Veranstaltung.@de
            - Une publication officielle ou placée sous responsabilité éditoriale contenant le programme, les participants, les thèmes, les itinéraires, les horaires et des informations organisationnelles sur une manifestation.@fr
            - Una pubblicazione ufficiale o sotto responsabilità editoriale contenente programma, partecipanti, temi, percorsi, orari e informazioni organizzative su un evento.@it
        Brochure:
          label:
            - Brochure@en
            - Broschüre@de
            - Brochure@fr
            - Opuscolo@it
        Flyer:
          label:
            - Flyer@en
            - Flyer@de
            - Prospectus@fr
            - Volantino@it
        Poster:
          label:
            - Poster@en
            - Plakat@de
            - Affiche@fr
            - Manifesto@it
        NewspaperArticleOrClipping:
          label:
            - Newspaper article or clipping@en
            - Zeitungsartikel oder Zeitungsausschnitt@de
            - Article ou coupure de presse@fr
            - Articolo o ritaglio di giornale@it

    CarnivalTextsAndMusicNotation:
      label:
