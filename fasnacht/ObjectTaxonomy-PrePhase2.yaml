# Pre-Phase-2 archive-material taxonomy retained for migration audit and rollback.
# Retained legacy node IDs preserve stable IRIs where old and new concepts correspond.
ObjectTaxonomy:
  label:
    - Archive material types@en
    - Archivgutarten@de
    - Types de documents et objets d'archive@fr
    - Tipi di materiali d'archivio@it
  definition:
    - Types of physical objects, records, publications, works, and analogue carriers preserved or described as independent archival units. Subject matter is classified separately with CarnivalTopicsTaxonomy.@en
    - Arten von physischen Objekten, Unterlagen, Publikationen, Werken und analogen Datenträgern, die als eigenständige Archiveinheiten aufbewahrt oder beschrieben werden. Der inhaltliche Gegenstand wird separat mit der CarnivalTopicsTaxonomy klassifiziert.@de
    - Types d'objets physiques, de documents, de publications, d'œuvres et de supports analogiques conservés ou décrits comme unités d'archive autonomes. Le sujet est classé séparément à l'aide de la CarnivalTopicsTaxonomy.@fr
    - Tipi di oggetti fisici, documenti, pubblicazioni, opere e supporti analogici conservati o descritti come unità archivistiche autonome. Il contenuto tematico è classificato separatamente con la CarnivalTopicsTaxonomy.@it
  nodes:
    CarnivalEquipmentAndMaterialObjects:
      label:
        - Carnival equipment and material objects@en
        - Fasnachtsausstattung und materielle Objekte@de
        - Équipement carnavalesque et objets matériels@fr
        - Equipaggiamento carnevalesco e oggetti materiali@it
      definition:
        - Physical objects made, worn, carried, played, displayed, or otherwise used in carnival practice.@en
        - Physische Objekte, die für die Fasnacht hergestellt, getragen, mitgeführt, gespielt, ausgestellt oder anderweitig verwendet werden.@de
        - Objets physiques fabriqués, portés, transportés, joués, exposés ou autrement utilisés dans la pratique du carnaval.@fr
        - Oggetti fisici fabbricati, indossati, trasportati, suonati, esposti o altrimenti utilizzati nella pratica carnevalesca.@it
      nodes:
        Laterne:
          label:
            - Lantern@en
            - Laterne@de
            - Lanterne@fr
            - Lanterna@it
        LanternPanel:
          label:
            - Lantern panel@en
            - Laternenbild@de
            - Panneau de lanterne@fr
            - Pannello di lanterna@it
          definition:
            - A separately preserved painted or illustrated panel that formed part of a carnival lantern.@en
            - Ein separat erhaltenes bemaltes oder illustriertes Bildfeld, das Teil einer Fasnachtslaterne war.@de
            - Un panneau peint ou illustré conservé séparément et ayant fait partie d'une lanterne de carnaval.@fr
            - Un pannello dipinto o illustrato conservato separatamente e originariamente parte di una lanterna carnevalesca.@it
        Larve:
          label:
            - Carnival mask@en
            - Larve@de
            - Masque de carnaval@fr
            - Maschera carnevalesca@it
        Kostuem:
          label:
            - Costume@en
            - Kostüm@de
            - Costume@fr
            - Costume@it
        Requisite:
          label:
            - Prop@en
            - Requisite@de
            - Accessoire@fr
            - Oggetto di scena@it
        Plakette:
          label:
            - Carnival badge@en
            - Plakette@de
            - Insigne de carnaval@fr
            - Distintivo di carnevale@it
        FloatOrChaise:
          label:
            - Float or chaise@en
            - Wagen oder Chaise@de
            - Char ou chaise@fr
            - Carro o chaise@it
        Musikinstrument:
          label:
            - Musical instrument@en
            - Musikinstrument@de
            - Instrument de musique@fr
            - Strumento musicale@it
          nodes:
            Trommel:
              label:
                - Drum@en
                - Trommel@de
                - Tambour@fr
                - Tamburo@it
            Piccolo:
              label:
                - Piccolo@en
                - Piccolo@de
                - Piccolo@fr
                - Ottavino@it
            AnderesInstrument:
              label:
                - Other musical instrument@en
                - Anderes Musikinstrument@de
                - Autre instrument de musique@fr
                - Altro strumento musicale@it

    Vereinsdokument:
      label:
        - Written and administrative records@en
        - Schrift- und Verwaltungsunterlagen@de
        - Écrits et documents administratifs@fr
        - Scritti e documenti amministrativi@it
      definition:
        - Unpublished records created through the administration, communication, membership, and financial activities of an organisation or person.@en
        - Unveröffentlichte Unterlagen, die bei Verwaltung, Kommunikation, Mitgliedschaft und finanziellen Tätigkeiten einer Organisation oder Person entstehen.@de
        - Documents non publiés produits dans le cadre de l'administration, de la communication, des adhésions et des activités financières d'une organisation ou d'une personne.@fr
        - Documenti non pubblicati prodotti nell'ambito dell'amministrazione, della comunicazione, delle adesioni e delle attività finanziarie di un'organizzazione o di una persona.@it
      nodes:
        Protokoll:
          label:
            - Minutes@en
            - Protokoll@de
            - Procès-verbal@fr
            - Verbale@it
        MembershipRegister:
