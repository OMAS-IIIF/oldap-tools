            - Song lyrics@en
            - Liedtext@de
            - Paroles de chanson@fr
            - Testo di canzone@it
        Manuscript:
          label:
            - Manuscript@en
            - Manuskript@de
            - Manuscrit@fr
            - Manoscritto@it
        MusicalNotation:
          label:
            - Musical notation@en
