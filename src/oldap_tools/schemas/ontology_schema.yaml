ontology: include('ontology')
---
ontology:
  project: include('project')
  lists: map(str(), any(), required=False)
  external_ontologies: map(str(), include('external_ontology'), required=False)
  classes: map(str(), include('resource_class'), required=False)
  standalone_properties: map(str(), include('property'), required=False)
  lucene_connectors: map(str(), include('lucene_connector'), required=False)

project:
  shortname: str()
  iri: str(required=False)
  namespace: str(required=False)
  start: any(required=False)
  label: any(str(), list(str()), map(str(), any()), null(), required=False)
  comment: any(str(), list(str()), map(str(), any()), null(), required=False)

external_ontology:
  namespace: str()
  label: any(str(), list(str()), map(str(), any()), null(), required=False)
  comment: any(str(), list(str()), map(str(), any()), null(), required=False)
  resource_classes: any(list(str()), null(), required=False)
  datatype_properties: any(list(str()), null(), required=False)
  object_properties: any(list(str()), null(), required=False)
  proposedResourceClass: any(list(str()), null(), required=False)
  proposedDatatypePropertyClass: any(list(str()), null(), required=False)
  proposedObjectPropertyClass: any(list(str()), null(), required=False)

resource_class:
  label: any(str(), list(str()), map(str(), any()), null(), required=False)
  comment: any(str(), list(str()), map(str(), any()), null(), required=False)
  superclass: list(str(), required=False)
  closed: any(bool(), null(), required=False)
  properties: list(include('property'), required=False)

property:
  iri: str(required=False)
  subproperty_of: any(str(), null(), required=False)
  datatype: any(str(), null(), required=False)
  to_class: any(str(), null(), required=False)
  node_kind: any(str(), null(), required=False)
  name: any(str(), list(str()), map(str(), any()), null(), required=False)
  description: any(str(), list(str()), map(str(), any()), null(), required=False)
  language_in: any(list(str()), null(), required=False)
  unique_lang: any(bool(), null(), required=False)
  in: list(any(), required=False)
  min_length: any(int(), null(), required=False)
  max_length: any(int(), null(), required=False)
  pattern: any(str(), null(), required=False)
  min_exclusive: any(num(), null(), required=False)
  min_inclusive: any(num(), null(), required=False)
  max_exclusive: any(num(), null(), required=False)
  max_inclusive: any(num(), null(), required=False)
  less_than: any(str(), null(), required=False)
  less_than_or_equals: any(str(), null(), required=False)
  inverse_of: any(str(), null(), required=False)
  equivalent_property: any(str(), null(), required=False)
  min_count: any(int(), null(), required=False)
  max_count: any(int(), null(), required=False)
  order: any(num(), null(), required=False)
  group: any(str(), null(), required=False)
  editor: any(str(), null(), required=False)

lucene_connector:
  configuration: map(required=False)
  types: list(str(), required=False)
  languages: list(str(), required=False)
  fields: any(map(str(), any()), list(any()), required=False)
  readonly: bool(required=False)
  detectFields: bool(required=False)
  importGraph: bool(required=False)
  skipInitialIndexing: bool(required=False)
  boostProperties: list(any(), required=False)
  stripMarkup: bool(required=False)
