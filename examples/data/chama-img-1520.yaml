        schema:name:
          - value: Stationsgebäude in Chama
            language: de
        schema:description:
          - value: >-
              Das historische Stationsgebäude von Chama ist im typischen Gelb
              der Denver & Rio Grande Western Railroad gestrichen. Im Vordergrund
              liegt das Ticket Office, in dem Fahrkarten gekauft oder abgeholt
              werden können. Die Aufnahme entstand am Abend nach der Ankunft des
              Zuges aus Antonito; der Bahnhof wird bald geschlossen. Der Blick
              geht westwärts zum heutigen Streckenende. Bis 1968 führte die
              Strecke von Chama weiter nach Durango, Colorado.

              Das Gebäude wurde von der Cumbres & Toltec Scenic Railroad
              sorgfältig restauriert. Nach Einschätzung des Fotografen vermittelt
              sein heutiges Erscheinungsbild einen Eindruck davon, wie der Bahnhof
              in den 1950er- und 1960er-Jahren ausgesehen haben dürfte.
            language: de
