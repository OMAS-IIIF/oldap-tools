        ingest_profile: image-iiif

    - iri: Annotation_IMG_0171_2026_08_21
      class: chama:KnowledgeContribution
      properties:
        chama:describes:
          - iri: chama:IMG_0171
        dcterms:contributor:
          - iri: chama:LukasRosenthaler
        dcterms:created:
          - value: "2026-08-21"
        chama:contributionLanguage:
          - value: de
        chama:sourceContext:
          - value: Project-owner annotation supplied during SALSAH 2 demo preparation
        chama:originalText:
          - value: |-
              Titel: Fosters Hotel and Saloon

              Was ist zu sehen: Fosters Hotel & Saloon wurde ca. 1881 gebaut, als Herberge für Eisenbahner der D&RGW und für Mineure, welche auf dem Weg in die Minen der San Juan Mountains waren.

              Aufnahmeort und Blickrichtung: Von der Main street aus, Richtung Osten (Cumbres Pass)

              Was geschieht gerade: Die Bar ist offen und gut frequentiert

              Persönliche Erinnerung oder Kontext: Bestes mexikanisches Essen in Chama, tolle Bar und eine einmalige Atmosphäre. Echter Wilder Westen!

              Unsicherheiten: Keine Unsicherheit wurde angegeben.

              Darf öffentlich gezeigt werden: Ja

              Gewünschte Urheberangabe: Lukas Rosenthaler
            language: de
        chama:normalizedDescription:
          - value: >-
              Foster's Hotel and Saloon steht an der Main Street in Chama. Das
              Gebäude wurde nach Angaben des Fotografen um 1881 errichtet und
              diente Eisenbahnern der Denver & Rio Grande Western Railroad sowie
              Bergleuten auf dem Weg zu den Minen in den San Juan Mountains als
              Unterkunft. Die abendliche Aufnahme blickt von der Main Street
              ostwärts in Richtung Cumbres Pass. Die Bar ist geöffnet und gut
              besucht.

              Für den Fotografen bietet Foster's das beste mexikanische Essen
              in Chama, eine grossartige Bar und eine einzigartige, vom Wilden
              Westen geprägte Atmosphäre.
            language: de
        chama:uncertaintyNote:
          - value: >-
              Das ungefähre Baujahr und die historische Nutzung stammen aus dem
              Wissen des Beitragenden und wurden noch nicht anhand
              dokumentarischer oder publizierter Quellen überprüft. Vor einer
              breiteren Veröffentlichung ist zu prüfen, ob Gäste erkennbar sind.
            language: de
        chama:normalizationNote:
          - value: >-
              Die vorhandene Datei IMG_0171.HEIC wird verwendet; die ursprünglich
              genannte Datei IMG_1771.HEIC war ein Zahlendreher. D&RGW wurde
              ausgeschrieben und persönliche Bewertungen bleiben als solche
              gekennzeichnet.
            language: de
      permissions:
        oldap:Unknown: DATA_VIEW
