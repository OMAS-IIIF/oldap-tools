        shared:protocol:
          - value: custom
        chama:creationDating:
          - value: "2023-08-25"
        chama:capturePlace:
          - iri: chama:ChamaMainStreet
        chama:publicDisplayPermission:
          - value: true
        chama:creditLine:
          - value: Lukas Rosenthaler
        chama:rightsNote:
          - value: >-
              Vom Fotografen für die öffentliche SALSAH-Demo freigegeben;
              erkennbare Personen sind vor einer breiteren Veröffentlichung
